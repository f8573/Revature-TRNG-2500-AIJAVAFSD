<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java OOP MCQ Quiz</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5b6475;--line:#dde2ec;--accent:#2f5bd3;--accent-soft:#e8eefc;--ok:#1f8a4c;--ok-soft:#e5f5ec;--bad:#c0392b;--bad-soft:#fbe9e7}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
  h1{font-size:1.15rem;margin:0}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;text-align:center;min-width:86px}
  .stat b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
  .stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)} .stat.score b{color:var(--accent)}
  .progress{height:4px;background:var(--line)} .progress div{height:100%;background:var(--accent);width:0;transition:width .25s}
  main{padding:24px 0 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:.85rem}
  .topic{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-weight:600}
  .qtext{font-size:1.1rem;font-weight:600;margin:4px 0 14px}
  pre{background:#1e2330;color:#e6e9ef;padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.9rem;margin:0 0 16px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent)}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .key{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .opt code,.qtext code,.ans code{background:#eef1f6;padding:1px 5px;border-radius:4px;font-size:.92em}
  .locked .opt{cursor:default} .locked .opt:hover{border-color:var(--line)}
  .opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
  .tag{margin-left:auto;font-size:.78rem;font-weight:700}
  .right .tag{color:var(--ok)} .wrong .tag{color:var(--bad)}
  .explain{margin-top:16px;padding:12px 14px;border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:6px;font-size:.95rem}
  .explain.miss{border-color:var(--bad);background:var(--bad-soft)}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
  button{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.submit{background:var(--ok);border-color:var(--ok);color:#fff}
  .dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px;justify-content:center}
  .dot{width:34px;height:34px;padding:0;border-radius:8px;font-size:.85rem;font-weight:600}
  .dot.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .dot.cur{outline:2px solid var(--ink);outline-offset:1px}
  .dot.r{background:var(--ok);border-color:var(--ok);color:#fff} .dot.w{background:var(--bad);border-color:var(--bad);color:#fff} .dot.s{background:#9aa3b2;border-color:#9aa3b2;color:#fff}
  .banner{display:none;margin-bottom:16px;padding:14px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .banner.show{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
  .banner h2{margin:0;font-size:1.1rem}
  .modal{position:fixed;inset:0;background:rgba(20,25,35,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border-radius:12px;padding:22px;max-width:400px;width:100%}
  .modal .box h3{margin:0 0 8px} .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .legend{font-size:.8rem;color:var(--muted);text-align:center;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <h1>Java OOP – MCQ Quiz</h1>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>Total Qs</span></div>
      <div class="stat"><b id="sAtt">0</b><span>Attempted</span></div>
      <div class="stat ok"><b id="sRight">–</b><span>Right</span></div>
      <div class="stat bad"><b id="sWrong">–</b><span>Wrong</span></div>
      <div class="stat score"><b id="sScore">–</b><span>Score</span></div>
    </div>
  </div>
  <div class="progress"><div id="bar"></div></div>
</header>

<main class="wrap">
  <div class="banner" id="banner">
    <h2 id="resultText"></h2>
    <button class="primary" id="restart">Restart Quiz</button>
  </div>
  <div class="card" id="card">
    <div class="qmeta"><span id="qnum"></span><span class="topic" id="topic"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="code"></div>
    <div class="opts" id="opts" role="radiogroup"></div>
    <div id="explain"></div>
    <div class="nav">
      <button id="prev">&larr; Previous</button>
      <button class="submit" id="submit">Submit Quiz</button>
      <button class="primary" id="next">Next &rarr;</button>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="legend" id="legend">Click a number to jump to that question.</div>
</main>

<div class="modal" id="modal">
  <div class="box">
    <h3>Submit quiz?</h3>
    <p id="modalText" style="margin:0;color:var(--muted)"></p>
    <div class="row"><button id="cancel">Keep answering</button><button class="submit" id="confirm">Submit</button></div>
  </div>
</div>

<script>
const Q = [
 {t:"Class",q:"A class in Java is best described as:",o:["An instance of an object","A blueprint or template for creating objects","A variable that stores data","A built-in data type"],a:1,e:"A class defines the fields and methods; objects are created from it."},
 {t:"Class",q:"Which of these correctly declares a class in Java?",o:["Class Student { }","class Student { }","struct Student { }","new class Student { }"],a:1,e:"The keyword <code>class</code> is lowercase in Java."},
 {t:"Object",q:"Which keyword is used to create an object in Java?",o:["create","object","new","this"],a:2,e:"<code>new</code> allocates memory and calls the constructor, e.g. <code>Student s = new Student();</code>"},
 {t:"Object",q:"What is the default value of an uninitialized <code>int</code> instance variable?",o:["null","0","Garbage value","Compile-time error"],a:1,e:"Instance variables get default values: int → 0, boolean → false, objects → null."},
 {t:"Scanner",q:"Which package must be imported to use the <code>Scanner</code> class?",o:["java.io","java.lang","java.util","java.scanner"],a:2,e:"<code>import java.util.Scanner;</code>"},
 {t:"Scanner",q:"Which Scanner method reads an entire line of text, including spaces?",o:["next()","nextLine()","readLine()","nextString()"],a:1,e:"<code>next()</code> reads only one word; <code>nextLine()</code> reads the whole line."},
 {t:"Inheritance",q:"Which keyword is used by a class to inherit another class?",o:["implements","inherits","extends","super"],a:2,e:"<code>class Car extends Vehicle { }</code> — <code>implements</code> is used for interfaces."},
 {t:"Inheritance",q:"Which type of inheritance is NOT supported through classes in Java?",o:["Single","Multilevel","Hierarchical","Multiple"],a:3,e:"A class cannot extend more than one class (to avoid the diamond problem). Multiple inheritance is possible only through interfaces."},
 {t:"Polymorphism",q:"Method overriding is an example of:",o:["Compile-time polymorphism","Runtime polymorphism","Encapsulation","Abstraction"],a:1,e:"The overridden method to call is decided at runtime based on the actual object (dynamic method dispatch)."},
 {t:"Polymorphism",q:"What is the output of the following code?",c:"class Animal { void sound() { System.out.println(\"Animal sound\"); } }\nclass Dog extends Animal { void sound() { System.out.println(\"Bark\"); } }\n\nAnimal a = new Dog();\na.sound();",o:["Animal sound","Bark","Compile-time error","Runtime error"],a:1,e:"The reference is Animal, but the object is Dog, so Dog's overridden <code>sound()</code> runs."},
 {t:"super",q:"Where must the <code>super()</code> call be placed inside a constructor?",o:["Anywhere in the constructor","As the last statement","As the first statement","Only inside the main method"],a:2,e:"<code>super()</code> must be the first statement in a child class constructor."},
 {t:"super",q:"Inside a child class, <code>super.display()</code> will:",o:["Call the child class's display() method","Call the parent class's display() method","Create a new parent object","Cause a compile-time error"],a:1,e:"<code>super</code> refers to the immediate parent class, so its version of the method is called."},
 {t:"Method Overloading",q:"Method overloading means methods with the same name but:",o:["Different return type only","Different access specifier","Different parameter list","Different class"],a:2,e:"Overloaded methods differ in the number, type or order of parameters."},
 {t:"Method Overloading",q:"Which of these is NOT a valid way to overload a method?",o:["Changing the number of parameters","Changing the type of parameters","Changing the order of parameter types","Changing only the return type"],a:3,e:"Changing only the return type causes a compile-time error, because the call would be ambiguous."},
 {t:"Method Overriding",q:"Which of these methods CANNOT be overridden?",o:["public method","protected method","final method","default (package) method"],a:2,e:"A <code>final</code> method cannot be overridden by a subclass. (Static and private methods are not overridden either.)"},
 {t:"Method Overriding",q:"Which annotation tells the compiler that a method is meant to override a parent method?",o:["@Overload","@Override","@Super","@Inherit"],a:1,e:"<code>@Override</code> makes the compiler check that a matching parent method exists."},
 {t:"Access Specifier",q:"Which access specifier is the most restrictive?",o:["public","protected","default","private"],a:3,e:"<code>private</code> members are accessible only within the same class."},
 {t:"Access Specifier",q:"A member declared with no access specifier (default) is accessible:",o:["Everywhere","Only within the same class","Only within the same package","Only in subclasses"],a:2,e:"Default (package-private) access allows use only by classes in the same package."},
 {t:"Array",q:"What is the index of the first element of an array in Java?",o:["0","1","-1","Depends on the array size"],a:0,e:"Java arrays are zero-indexed; the last index is <code>length - 1</code>."},
 {t:"Array",q:"What happens when this code runs?",c:"int[] arr = new int[5];\nSystem.out.println(arr[5]);",o:["Prints 0","Prints null","Throws ArrayIndexOutOfBoundsException","Compile-time error"],a:2,e:"Valid indexes are 0 to 4. Accessing index 5 throws <code>ArrayIndexOutOfBoundsException</code> at runtime."}
];
const N=Q.length, L="ABCD", ans=Array(N).fill(null);
let cur=0, submitted=false;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function stats(){
  const att=ans.filter(x=>x!==null).length;
  $("sTotal").textContent=N; $("sAtt").textContent=att;
  $("bar").style.width=(att/N*100)+"%";
  if(submitted){
    const r=ans.filter((x,i)=>x===Q[i].a).length;
    $("sRight").textContent=r; $("sWrong").textContent=att-r;
    $("sScore").textContent=r+" / "+N;
  }
}
function render(){
  const d=Q[cur];
  $("qnum").textContent=`Question ${cur+1} of ${N}`;
  $("topic").textContent=d.t;
  $("qtext").innerHTML=d.q;
  $("code").innerHTML=d.c?`<pre>${esc(d.c)}</pre>`:"";
  $("card").classList.toggle("locked",submitted);
  $("opts").innerHTML=d.o.map((o,i)=>{
    let cls="opt", tag="";
    if(submitted){
      if(i===d.a){cls+=" right";tag="Correct answer";}
      else if(i===ans[cur]){cls+=" wrong";tag="Your answer";}
    } else if(i===ans[cur]) cls+=" sel";
    if(submitted&&i===d.a&&i===ans[cur]) tag="Your answer ✓";
    return `<label class="${cls}"><input type="radio" name="o" value="${i}" ${ans[cur]===i?"checked":""} ${submitted?"disabled":""}><span class="key">${L[i]}</span><span>${o.includes("<")?o:esc(o)}</span><span class="tag">${tag}</span></label>`;
  }).join("");
  if(submitted){
    const ok=ans[cur]===d.a, skip=ans[cur]===null;
    $("explain").innerHTML=`<div class="explain ${ok?"":"miss"}"><b>${ok?"Correct!":skip?"Not attempted.":"Incorrect."}</b> Right answer: <b>${L[d.a]}. ${esc(d.o[d.a])}</b><br>${d.e}</div>`;
  } else $("explain").innerHTML="";
  $("prev").disabled=cur===0; $("next").disabled=cur===N-1;
  $("submit").style.display=submitted?"none":"";
  $("dots").innerHTML=Q.map((_,i)=>{
    let c="dot";
    if(submitted) c+=ans[i]===null?" s":ans[i]===Q[i].a?" r":" w";
    else if(ans[i]!==null) c+=" done";
    if(i===cur) c+=" cur";
    return `<button class="${c}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
  }).join("");
  $("legend").textContent=submitted?"Green = right, Red = wrong, Grey = not attempted. Click a number to review.":"Click a number to jump to that question.";
  stats();
}
$("opts").addEventListener("change",e=>{if(!submitted){ans[cur]=+e.target.value;render();}});
$("prev").onclick=()=>{if(cur>0){cur--;render();}};
$("next").onclick=()=>{if(cur<N-1){cur++;render();}};
$("dots").onclick=e=>{const b=e.target.closest(".dot");if(b){cur=+b.dataset.i;render();}};
$("submit").onclick=()=>{
  const left=ans.filter(x=>x===null).length;
  $("modalText").textContent=left?`You have ${left} unanswered question${left>1?"s":""}. Unanswered questions get 0 marks.`:"You have answered all questions. Your answers will be locked.";
  $("modal").classList.add("show");
};
$("cancel").onclick=()=>$("modal").classList.remove("show");
$("confirm").onclick=()=>{
  $("modal").classList.remove("show"); submitted=true; cur=0;
  const r=ans.filter((x,i)=>x===Q[i].a).length;
  $("resultText").textContent=`Quiz submitted — you scored ${r} out of ${N} (${Math.round(r/N*100)}%). Review the right answers below.`;
  $("banner").classList.add("show"); render(); window.scrollTo(0,0);
};
$("restart").onclick=()=>{ans.fill(null);submitted=false;cur=0;$("banner").classList.remove("show");render();};
document.addEventListener("keydown",e=>{
  if($("modal").classList.contains("show")) return;
  if(e.key==="ArrowRight") $("next").click();
  if(e.key==="ArrowLeft") $("prev").click();
});
render();
</script>
</body>
</html>
