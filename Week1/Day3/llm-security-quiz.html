<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Security Quiz</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#18202f; --muted:#5d6779; --line:#dde2ee;
  --accent:#3454d1; --accent-ink:#fff; --ok:#12805c; --ok-bg:#e3f6ee; --bad:#c0352b; --bad-bg:#fdebe9;
  --chip:#eef1fa; --shadow:0 1px 3px rgba(20,30,60,.08),0 8px 24px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1422; --card:#181f33; --ink:#e8ecf6; --muted:#9aa5bd; --line:#2a3350;
    --accent:#6f8bff; --accent-ink:#0b1020; --ok:#4fd1a1; --ok-bg:#12332a; --bad:#ff7f73; --bad-bg:#3a1b1a;
    --chip:#222b45; --shadow:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.badge{background:var(--chip);padding:2px 10px;border-radius:99px;font-weight:600;color:var(--ink)}
.badge.sc{background:#fff1d6;color:#7a4b00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.sc{background:#3d3012;color:#ffd48a}}
.q{font-size:18px;font-weight:600;margin:0 0 16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--accent);background:var(--chip)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-size:16px}
.fb p{margin:4px 0 0}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.dot.cur{outline:2px solid var(--accent)}
.dot.ok{background:var(--ok);color:#fff;border-color:var(--ok)} .dot.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.res h2{margin:0 0 4px}
.big{font-size:56px;font-weight:800;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev small{color:var(--muted)}
.tag{font-weight:700} .tag.ok{color:var(--ok)} .tag.bad{color:var(--bad)}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)} .q{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>LLM Security &amp; Optimization Quiz</h1>
  <p class="sub">50 questions · prompt injection, input validation, prompt hardening, PII masking</p>

  <div class="stats">
    <div class="stat ok"><b id="sRight">0</b><span>Right</span></div>
    <div class="stat bad"><b id="sWrong">0</b><span>Wrong</span></div>
    <div class="stat"><b id="sLeft">50</b><span>Unanswered</span></div>
    <div class="stat"><b id="sPct">0%</b><span>Score</span></div>
  </div>
  <div class="bar"><i id="prog"></i></div>

  <div class="tabs" role="group" aria-label="Filter questions">
    <button class="tab" data-f="all" aria-pressed="true">All (50)</button>
    <button class="tab" data-f="s" aria-pressed="false">Scenario-based</button>
    <button class="tab" data-f="c" aria-pressed="false">Concept</button>
    <button class="tab" id="shuf" aria-pressed="false">Shuffle questions</button>
  </div>

  <div id="app" class="card"></div>
  <div class="nav" id="nav"></div>
</div>

// ---------- app ----------
const $ = id => document.getElementById(id);
const LABELS = ['A','B','C','D'];
let Q = [], order = [], filter = 'all', shuffleQs = false, pos = 0;
let answers = {}; // id -> {picked, correct}
let pending = null; // picked index before submit

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function build(){
  Q = RAW.map((r,i)=>{
    const opts = shuffle([{t:r[3],ok:true},...r[4].map(t=>({t,ok:false}))]);
    return {id:i,type:r[0],mod:r[1],q:r[2],opts,ans:opts.findIndex(o=>o.ok),exp:r[5]};
  });
}
function applyFilter(){
  let ids = Q.filter(q=>filter==='all'||q.type===filter).map(q=>q.id);
  if(shuffleQs) ids = shuffle(ids);
  order = ids; pos = 0; pending = null;
}
function counts(){
  const v = Object.values(answers); const right = v.filter(a=>a.correct).length;
  return {right, wrong:v.length-right, answered:v.length};
}
function updateStats(){
  const c = counts(), total = Q.length;
  $('sRight').textContent=c.right; $('sWrong').textContent=c.wrong;
  $('sLeft').textContent=total-c.answered;
  $('sPct').textContent = c.answered ? Math.round(c.right/c.answered*100)+'%' : '0%';
  $('prog').style.width = (c.answered/total*100)+'%';
}
function renderNav(){
  $('nav').innerHTML = order.map((id,i)=>{
    const a = answers[id]; const cls = ['dot', a?(a.correct?'ok':'bad'):'', i===pos?'cur':''].join(' ');
    return `<button class="${cls}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
  }).join('');
}
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function render(){
  updateStats(); renderNav();
  if(!order.length){ $('app').innerHTML='<p>No questions in this filter.</p>'; return; }
  const q = Q[order[pos]], done = answers[q.id];
  const picked = done ? done.picked : pending;
  let h = `<div class="meta"><span>Question ${pos+1} of ${order.length}</span>
    <span class="badge ${q.type==='s'?'sc':''}">${q.type==='s'?'Scenario':'Concept'}</span><span class="badge">${q.mod}</span></div>
    <p class="q">${esc(q.q)}</p><div class="opts" role="radiogroup">`;
  q.opts.forEach((o,i)=>{
    let cls='opt';
    if(done){ if(i===q.ans) cls+=' right'; else if(i===picked) cls+=' wrong'; }
    else if(i===picked) cls+=' sel';
    h += `<button class="${cls}" data-o="${i}" ${done?'disabled':''} role="radio" aria-checked="${i===picked}"><span class="k">${LABELS[i]}</span><span>${esc(o.t)}</span></button>`;
  });
  h += '</div>';
  if(done){
    h += `<div class="fb ${done.correct?'ok':'bad'}"><h3>${done.correct?'Correct!':'Incorrect'}</h3>
      <p><b>Right answer: ${LABELS[q.ans]}.</b> ${esc(q.opts[q.ans].t)}</p><p>${esc(q.exp)}</p></div>`;
  }
  const last = pos===order.length-1;
  h += `<div class="actions">`;
  if(!done) h += `<button class="btn" id="submit" ${picked==null?'disabled':''}>Submit</button>`;
  else h += `<button class="btn" id="next">${last?'See results':'Next question'}</button>`;
  h += `<button class="btn sec" id="prev" ${pos===0?'disabled':''}>Previous</button>
        <button class="btn sec" id="finish">Finish &amp; view results</button></div>`;
  $('app').innerHTML = h;
}

function results(){
  const c = counts(), total = Q.length, pct = Math.round(c.right/total*100);
  const by = (f)=>{ const qs=Q.filter(f); const r=qs.filter(q=>answers[q.id]&&answers[q.id].correct).length; return `${r} / ${qs.length}`; };
  const mods = [...new Set(Q.map(q=>q.mod))];
  let h = `<div class="res"><h2>Results</h2><div class="big">${c.right}<span style="font-size:24px;color:var(--muted)"> / ${total}</span></div>
    <p>${pct}% of all questions correct${c.answered<total?` (${total-c.answered} unanswered)`:''}. ${pct>=80?'Excellent work.':pct>=60?'Good effort, review the misses below.':'Review the slides and try again.'}</p>
    <div class="grid2">
      <div class="stat ok"><b>${c.right}</b><span>Right</span></div>
      <div class="stat bad"><b>${c.wrong}</b><span>Wrong</span></div>
      <div class="stat"><b>${total-c.answered}</b><span>Unanswered</span></div>
      <div class="stat"><b>${c.answered?Math.round(c.right/c.answered*100):0}%</b><span>Accuracy (answered)</span></div>
      <div class="stat"><b>${by(q=>q.type==='s')}</b><span>Scenario</span></div>
      <div class="stat"><b>${by(q=>q.type==='c')}</b><span>Concept</span></div>
    </div><h3>By module</h3><div class="grid2">${mods.map(m=>`<div class="stat"><b>${by(q=>q.mod===m)}</b><span>${m}</span></div>`).join('')}</div>
    <div class="actions"><button class="btn" id="restart">Restart quiz</button><button class="btn sec" id="back">Back to questions</button></div>
    <h3 style="margin-top:22px">Review</h3>`;
  Q.forEach((q,i)=>{
    const a = answers[q.id];
    const st = a ? (a.correct?'<span class="tag ok">Right</span>':'<span class="tag bad">Wrong</span>') : '<span class="tag">Skipped</span>';
    h += `<div class="rev"><b>${i+1}. ${esc(q.q)}</b><br>${st}${a&&!a.correct?` · <small>You chose: ${esc(q.opts[a.picked].t)}</small>`:''}<br><small>Answer: ${esc(q.opts[q.ans].t)}</small></div>`;
  });
  $('app').innerHTML = h + '</div>';
  updateStats(); $('nav').innerHTML=''; window.scrollTo({top:0});
}

function restart(){ answers={}; build(); applyFilter(); render(); window.scrollTo({top:0}); }

document.addEventListener('click',e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.o!==undefined && !answers[order[pos]]){ pending = +t.dataset.o; render(); }
  else if(t.id==='submit'){ const q=Q[order[pos]]; answers[q.id]={picked:pending,correct:pending===q.ans}; pending=null; render(); }
  else if(t.id==='next'){ if(pos===order.length-1) results(); else { pos++; pending=null; render(); } }
  else if(t.id==='prev'){ pos--; pending=null; render(); }
  else if(t.id==='finish'){ results(); }
  else if(t.id==='restart'){ restart(); }
  else if(t.id==='back'){ render(); }
  else if(t.dataset.i!==undefined){ pos=+t.dataset.i; pending=null; render(); }
  else if(t.dataset.f){ filter=t.dataset.f; document.querySelectorAll('.tab[data-f]').forEach(b=>b.setAttribute('aria-pressed',b===t)); applyFilter(); render(); }
  else if(t.id==='shuf'){ shuffleQs=!shuffleQs; t.setAttribute('aria-pressed',shuffleQs); applyFilter(); render(); }
});
document.querySelector('[data-f="s"]').textContent = 'Scenario-based ('+RAW.filter(r=>r[0]==='s').length+')';
document.querySelector('[data-f="c"]').textContent = 'Concept ('+RAW.filter(r=>r[0]==='c').length+')';
document.querySelector('[data-f="all"]').textContent = 'All ('+RAW.length+')';
document.querySelector('.sub').textContent = RAW.length+' questions · prompt injection, input validation, prompt hardening, PII masking';
build(); applyFilter(); render();
</script>
</body>
</html>
